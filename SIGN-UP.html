<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon">
                <i class="fa fa-user"></i>
            </div>

            <h2>Create an account</h2>
            <p>Joins us today!</p>
        </div>

        <form class="register-form">
            <div class="input-group">
                <label>Last name</label>
                <div class="input-field">
                    <i class="fa fa-user"></i>
                    <input type="text" placeholder="Enter your Last name" required>
                </div>
            </div>

            <div class="input-group">
                <label>First name</label>
                <div class="input-field">
                    <i class="fa fa-user"></i>
                    <input type="text" placeholder="Enter your First name" required>
                </div>
            </div>

            <div class="input-group">
                <label>Email address</label>
                <div class="input-field">
                    <i class="fa fa-envelope"></i>
                    <input type="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="input-group">
                <label class="password">Password</label>
                <div class="input-field">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Create your password" required>
                </div>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm password</label>
                <div class="input-field">
                    <i class="fa fa-lock"></i>
                    <input type="password" name="confirm-password" id="confirm-password"
                        placeholder="Confirm your password" required>
                </div>
            </div>

            <div class="gender">
                <label>Gender</label>
                <div class="gender-option">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <!-- <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label> -->
                </div>
            </div>
            <div class="remember-me">
                <input type="checkbox" id="remember-checkbox" name="remember-me">
                <label for="remember-checkbox">Remember me</label>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms & conditions and privacy policy</label>
            </div>

            <button type="submit">Sign up</button>
        </form>

        <p class="login-text">
            Already have an account? <a href="LOG-IN.html">Login</a>
        </p>
    </div>

    <footer class="footer">
        <small>&copy; 2026 Adrian Petru Rus — Tous droits réservés &check;</small>
    </footer>
</body>

</html>
